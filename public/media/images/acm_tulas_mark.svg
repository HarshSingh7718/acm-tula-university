<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="markDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF" />
      <stop offset="50%" stop-color="#0088D6" />
      <stop offset="100%" stop-color="#005B9E" />
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Diamond Base -->
  <g filter="url(#markShadow)">
    <polygon 
      points="110,15 205,110 110,205 15,110" 
      fill="url(#markDiamondGrad)" 
    />
  </g>

  <!-- Inner Circle -->
  <circle 
    cx="110" 
    cy="110" 
    r="58" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="5" 
  />

  <!-- "acm" Text -->
  <text 
    x="110" 
    y="109" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="42" 
    letter-spacing="-0.04em"
  >acm</text>

  <!-- "student chapter" Text -->
  <text 
    x="110" 
    y="130" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
    font-weight="700" 
    font-size="10.5" 
    letter-spacing="0.01em"
  >student chapter</text>
</svg>
