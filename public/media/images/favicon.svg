<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="favDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF" />
      <stop offset="50%" stop-color="#0088D6" />
      <stop offset="100%" stop-color="#005B9E" />
    </linearGradient>
  </defs>

  <!-- Diamond Base -->
  <polygon 
    points="110,15 205,110 110,205 15,110" 
    fill="url(#favDiamondGrad)" 
  />

  <!-- Inner Circle -->
