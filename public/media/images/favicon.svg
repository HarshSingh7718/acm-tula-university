    font-size="42" 
    letter-spacing="-0.04em"
  >acm</text>

  <!-- "student chapter" Text -->
  <text 
    x="110" 
    y="130" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
    font-weight="700" 
    font-size="10.5" 
    letter-spacing="0.01em"
  >student chapter</text>
</svg>
